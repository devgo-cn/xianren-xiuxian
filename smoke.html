<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>smoke</title></head>
<body>
<script src="./test_orig/pixi-legacy.min.js"></script>
<script src="./assets/db/dragonBones.js"></script>
<script src="./assets/db/canvas-dragonbones.js"></script>
<script>
window.__SMOKE = [];
window.__SMOKE_DONE = false;
(async function () {
  const slugs = ["ancient_automaton", "animated_drill_dwarf", "arcane_golem", "axe_goblin", "bee", "black_ant_queen", "bonemask_shadow_creature", "clockwork_king", "clockwork_skull", "colossal_crow", "continental_turtle_rukkha", "crab_king_karkinos", "cultist_mage", "dagger_goblin", "daidarabotchi", "dark_queen_shaccadyoggoth", "darkness_titan_ilnoct", "dragon_huanglong", "dryad_queen_rafflesia", "dryad_yggdrasil", "eldritch_overmind", "forest_turtle", "fox", "ghost", "giant_kitsune", "goblin_machine_gun", "god_warrior_dagon", "god_warrior_isis", "god_warrior_osiris", "god_warrior_skoll", "goddess_aphrodite", "grand_sorceress_duesa", "gun_mimic", "hades", "hellhound_garm", "ice_titan_demeres", "insect_queen", "jiangshi", "jubokko", "king_archial", "legendary_knight_michael", "legendary_knight_regulus", "legendary_knight_remment", "librarium_animated_legendary_knight_pizarro", "librarium_animated_mechadragon_ladon", "librarium_animated_skull_knight_xoer", "light_titan_alfadriel", "living_armor", "living_hoard_midas", "mageshroom", "magical_girl_goblin", "mecha_rattlesnake", "mechascorpion", "mermaid_warrior_undeen", "mimic", "mythical_knight_goldnharl", "parrot_king", "poseidon", "radulac_the_voidvod", "runic_stone_golem_goliath", "scorpion", "sea_calamity_urmica", "sea_dragon_leviathan", "shaccadyoggoth", "slime_flynn", "son_of_valhalla", "spirit_fighter", "sun_goddess", "sword_goblin", "tantalus", "thanatos", "the_fallen", "the_horde", "thunder_titan_dynamo", "unicorn", "witch_baba", "wolf", "zeograth", "zodiac_cancer"];
  const cv = document.createElement("canvas");
  cv.width = 400; cv.height = 400;
  const ctx = cv.getContext("2d");
  for (const slug of slugs) {
    const rec = { slug, ok: false, px: 0, err: "", meshN: 0 };
    try {
      const [skeR, texR] = await Promise.all([
        fetch("assets/db/monsters/" + slug + "/ske.json").then(r => { if (!r.ok) throw new Error("ske http " + r.status); return r.json(); }),
        fetch("assets/db/monsters/" + slug + "/tex.json").then(r => { if (!r.ok) throw new Error("tex http " + r.status); return r.json(); })
      ]);
      const img = await new Promise((res, rej) => {
        const im = new Image();
        im.onload = () => res(im);
        im.onerror = () => rej(new Error("img load fail"));
        im.src = "assets/db/monsters/" + slug + "/tex.webp";
      });
      const factory = window.CanvasDragonBones.buildFactory(skeR, texR, img);
      const armName = skeR.armature[0].name;
      const arm = factory.buildArmature(armName);
      if (!arm) throw new Error("buildArmature null");
      const animNames = (skeR.armature[0].animation || []).map(a => a.name);
      if (animNames.length) arm.animation.fadeIn(animNames[0], 0, 0);
      // 记录 mesh 数
      for (const sk of skeR.armature[0].skin || []) {
        for (const ss of sk.slot || []) {
          for (const d of ss.display || []) if (d.type === "mesh") rec.meshN++;
        }
      }
      // 动画推进 30 帧逐步绘制（覆盖多个姿势，含蒙皮变形）
      const bb = window.CanvasDragonBones.armatureAABB(arm);
      const baseH = Math.max(1, bb.maxY - bb.minY);
      let pxTotal = 0;
      for (let f = 0; f < 30; f++) {
        arm.advanceTime(1 / 30);
        const b2 = window.CanvasDragonBones.armatureAABB(arm);
        const s = 300 / baseH;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, 400, 400);
        ctx.translate(200, 370);
        ctx.scale(s, s);
        ctx.translate(-(b2.minX + b2.maxX) / 2, -b2.maxY);
        window.CanvasDragonBones.drawArmature(ctx, arm);
        const d = ctx.getImageData(0, 0, 400, 400).data;
        let n = 0;
        for (let i = 3; i < d.length; i += 16) if (d[i] > 10) n++;
        pxTotal += n;
      }
      rec.px = pxTotal;
      rec.ok = pxTotal > 300;
      if (!rec.ok) rec.err = "too-few-pixels";
      arm.dispose();
    } catch (e) {
      rec.err = String(e && e.message || e);
    }
    window.__SMOKE.push(rec);
  }
  window.__SMOKE_DONE = true;
})();
</script>
</body>
</html>
