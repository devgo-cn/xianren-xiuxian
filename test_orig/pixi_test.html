<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Pixi 对照</title></head>
<body style="background:#222;margin:0">
<div id="st" style="width:600px;height:600px"></div>
<script src="./pixi-legacy.min.js"></script>
<script src="../assets/db/dragonBones.js"></script>
<script>
const app = new PIXI.Application({ width: 600, height: 600, backgroundColor: 0x222233, forceCanvas: true });
document.getElementById('st').appendChild(app.view);
const factory = new dragonBones.PixiFactory();
fetch('./DaggerGoblin_ske.json').then(r => r.json()).then(ske =>
  fetch('./DaggerGoblin_tex.json').then(r => r.json()).then(tex => {
    const ptex = PIXI.Texture.from('./DaggerGoblin_tex.png');
    ptex.baseTexture.once('loaded', () => {
      factory.parseDragonBonesData(ske);
      factory.parseTextureAtlasData(tex, ptex);
      const armature = factory.buildArmature('DaggerGoblin');
      armature.animation.fadeIn('Idle', 0, 0);
      armature.display.x = 300; armature.display.y = 500;
      armature.display.scale.set(1.4);
      app.stage.addChild(armature.display);
      app.ticker.add(() => armature.advanceTime(app.ticker.deltaMS / 1000));
      window.__arm = armature;
    });
  }));
</script>
</body></html>
